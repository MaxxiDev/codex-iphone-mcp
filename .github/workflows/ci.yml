name: Source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Show toolchain
        run: swift --version
      - name: Swift unit tests
        run: swift test
      - name: Python unit and HTTP integration tests
        run: python3 -B -m unittest discover -s Tests/PythonTests -p 'test_*.py'
      - name: Release build
        run: swift build -c release
      - name: MCP protocol check (no phone input)
        run: python3 -B scripts/check-mcp.py -- .build/release/iphone-use mcp
