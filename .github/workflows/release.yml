name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release (for example v0.2.0 or v0.2.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Show build tools
        run: |
          xcodebuild -version
          swift --version

      - name: Test, package, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          CODESIGN_IDENTITY: '-'
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/iphone-use-pycache
        run: ./scripts/release.sh "$RELEASE_TAG" --publish

      - name: Preserve release files
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: build/releases/
          if-no-files-found: ignore
          retention-days: 7
